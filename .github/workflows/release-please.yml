name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Maintains a release PR from Conventional Commits on main. Merging it bumps
      # manifest.json, updates CHANGELOG.md, tags vX.Y.Z and publishes the GitHub
      # Release that HACS consumes. Config: release-please-config.json.
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
